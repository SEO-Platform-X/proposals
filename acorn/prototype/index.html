async function keyFrom(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(k){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
(async()=>{try{const r=sessionStorage.getItem('acornk');if(r){const k=await crypto.subtle.importKey('raw',d(r),'AES-GCM',true,['decrypt']);await open_(k)}}catch(e){try{sessionStorage.removeItem('acornk')}catch(_){}}})();

 try{const k=await keyFrom(document.getElementById('pw').value);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));
