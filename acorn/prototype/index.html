async function keyFrom(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(k){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
// Returning session: already unlocked and agreed this session
(async()=>{try{const r=sessionStorage.getItem('acornk');const ok=sessionStorage.getItem('acornok');if(r&&ok){const k=await crypto.subtle.importKey('raw',d(r),'AES-GCM',true,['decrypt']);await open_(k)}}catch(e){try{sessionStorage.removeItem('acornk')}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');er.textContent='';
 const email=document.getElementById('em').value.trim().toLowerCase();
 if(!/^[^@\s]+@acorn\.me$/.test(email)){er.textContent='Please use your @acorn.me email address.';document.getElementById('em').select();return}
 b.disabled=true;
 try{const k=await keyFrom(document.getElementById('pw').value);await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(P.c));
  log(email,'entered');
  try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));sessionStorage.setItem('acornk',btoa(String.fromCharCode(...raw)));sessionStorage.setItem('acornok','1')}catch(_){}
  await open_(k);
 }catch(x){er.textContent='That password isn\'t right. Try again.';b.disabled=false;document.getElementById('pw').select()}});
})();
