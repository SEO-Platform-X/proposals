<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Acorn Ecosystem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: acorn.me system. White page, hairline slate rules, square corners, black primary actions,
   pale-blue mono eyebrows. Top: logo + search + quick request, then "Viewing as" switcher. Left nav per role. */
:root{
  --sans:'Geist','Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --page:#ffffff;--wash:#f8fafc;--tint:#f1f5f9;--fog:#edeff2;
  --ink:#111111;--ink-2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line-2:#cbd5e1;
  --blue:#8eb6d6;--blue-ink:#2f5f86;--blue-soft:#e2eef7;
  --good:#15803d;--good-soft:#eaf6ee;--warn:#a15c07;--warn-soft:#fdf3e1;--bad:#b42318;--bad-soft:#fdeceb;
  --r1:#111111;--r2:#5b84a8;--r3:#94a3b8;--r4:#334155;
  --scrim:rgba(17,17,17,.42);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ---------- top ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--line)}
.bar1,.bar2{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
.bar1{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.logo svg{height:15px;width:auto;display:block}
.logo span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-left:1px solid var(--line);padding-left:14px}
.search{position:relative;flex:1 1 auto;max-width:520px;margin-left:auto}
.search input{padding-left:34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--page);border:1px solid var(--line-2);box-shadow:0 12px 32px rgba(15,23,42,.12);max-height:60vh;overflow:auto;z-index:40}
.sres .grp{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-ink);padding:10px 12px 4px}
.sres button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;cursor:pointer}
.sres button:hover,.sres button:focus-visible{background:var(--tint);outline:0}
.sres small{color:var(--muted)}
.barr{display:flex;gap:8px;flex:0 0 auto}
.me{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-left:14px;border-left:1px solid var(--line)}
.me .av{width:30px;height:30px;border-radius:50%;background:var(--fog);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2)}
.me .who{display:grid;line-height:1.2}
.me .who b{font-size:13px;font-weight:600;white-space:nowrap}
.me .who span{font-size:11.5px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.logo span,.me .who{display:none}.barr{display:none}}

/* ---------- prototype controls (deliberately NOT Acorn-branded: sits outside the product) ---------- */
.demo{background:#14171c;color:#e7e9ee;border-bottom:3px solid #f2c14e}
.dwrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;display:grid;gap:10px}
.drow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dtag{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;background:#f2c14e;color:#14171c;padding:3px 8px;font-weight:500}
.dnote{font-size:12.5px;color:#a9b0bd;flex:1 1 300px}
.dbtn{background:transparent;border:1px solid #3a404b;color:#e7e9ee;padding:4px 10px;font-size:12px;cursor:pointer}
.dbtn:hover{border-color:#a9b0bd}
.dtypes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dtypes::-webkit-scrollbar{display:none}
.dtype{flex:0 0 auto;display:grid;gap:1px;text-align:left;background:#1d2128;border:1px solid #2c313a;color:#e7e9ee;padding:7px 12px 8px;cursor:pointer;min-width:150px;line-height:1.25}
.dtype:hover{border-color:#6b7280}
.dtype .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#f2c14e}
.dtype b{font-size:13px;font-weight:600;white-space:nowrap}
.dtype span:last-child{font-size:11.5px;color:#9aa1ad;white-space:nowrap}
.dtype[aria-pressed="true"]{background:#f2c14e;border-color:#f2c14e;color:#14171c}
.dtype[aria-pressed="true"] .k,.dtype[aria-pressed="true"] span:last-child{color:#4a3a10}
.dexp{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12.5px;color:#c9ced8}
.dexp .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#f2c14e;margin-right:6px}
.frame-lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8b93a1;background:#14171c;text-align:center;padding:3px 0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:36px;max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{padding-block:28px;display:flex;flex-direction:column;gap:1px;align-self:start}
.nav .lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-ink);margin:0 0 8px 10px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-align:left;white-space:nowrap;border-left:2px solid transparent}
.nb:hover{background:var(--wash);color:var(--ink)}
.nb[aria-current="page"]{color:var(--ink);font-weight:600;border-left-color:var(--ink);background:var(--wash)}
.cnt{font-family:var(--mono);font-size:11px;min-width:20px;text-align:center;padding:0 5px;background:var(--fog);color:var(--ink-2)}
.cnt.hot{background:var(--ink);color:#fff}
.main{padding-block:30px 80px;min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{flex-direction:row;overflow-x:auto;padding-block:10px 0;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .nav::-webkit-scrollbar{display:none}
  .nav .lbl,.access{display:none}
  .nb{border-left:0;border-bottom:2px solid transparent}
  .nb[aria-current="page"]{border-bottom-color:var(--ink);background:transparent}
  .main{padding-top:20px}
}

/* ---------- type + page ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-ink)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;margin-bottom:26px}
.ph h1{font-size:clamp(28px,3.4vw,40px);font-weight:300;letter-spacing:-1px;line-height:1.08;margin-top:6px}
.ph p{margin:8px 0 0;color:var(--ink-2);max-width:66ch;font-size:15px}
.ph p b{font-weight:600;color:var(--ink)}
.crumb{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:13px;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
h2.sec{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec .muted{font-weight:400}
.stack{display:grid;gap:28px}
.stack.tight{gap:14px}
.cols{display:grid;gap:28px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols.even{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);background:var(--page);padding:18px;min-width:0}
.box.wash{background:var(--wash)}
.box>h2.sec{margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.end{justify-content:flex-end}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));border:1px solid var(--line)}
.stat{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
@media (max-width:820px){.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:300;letter-spacing:-1px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.meter{position:relative;height:6px;background:var(--fog);margin-top:12px}
.meter>i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint)}
.meterlab{position:relative;height:16px;margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.meterlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:1px 7px;font-size:11.5px;font-weight:500;background:var(--fog);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.ink{background:var(--ink);color:#fff}
.tag .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.lock{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px}

/* buttons + fields */
.btn{font-weight:600;font-size:13px;padding:7px 13px;border:1px solid var(--line-2);background:var(--page);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border-radius:0}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:#111;color:#fff;border-color:#111}
.btn.pri:hover{background:#2b2b2b}
.btn.sec{background:var(--fog);border-color:var(--faint)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.link{border:0;background:transparent;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.link:hover{color:var(--blue-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);border-color:var(--line-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line-2);border-radius:0;background:var(--page);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical;min-height:72px}
.f{display:grid;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.f small{font-weight:400;color:var(--muted)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{width:16px;height:16px;margin-top:2px;flex:0 0 auto;accent-color:#111}
.seg{display:inline-flex;border:1px solid var(--line-2);overflow-x:auto;max-width:100%}
.seg button{border:0;border-right:1px solid var(--line-2);background:var(--page);padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* action list (the core pattern: why + one clear next action) */
.al{border:1px solid var(--line)}
.ai{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 16px;align-items:center;padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
.ai:last-child{border-bottom:0}
.ai .rail{align-self:stretch;margin:-14px 0;background:transparent}
.ai.bad .rail{background:var(--bad)}.ai.warn .rail{background:#e0a33a}.ai.blue .rail{background:var(--blue)}
.ai .t{font-weight:600;font-size:14px}
.ai .why{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.ai .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.ai{grid-template-columns:4px minmax(0,1fr)}.ai .acts{grid-column:2;justify-content:flex-start;margin-top:10px}}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--wash);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--wash)}
td.r,th.r{text-align:right}
.nm{font-weight:600}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

/* progress tracker (plain-language order status) */
.trk{display:grid;grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto;margin-top:10px}
.trk .s{position:relative;padding-top:18px;font-size:11.5px;color:var(--faint);padding-right:6px}
.trk .s::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--line)}
.trk .s::after{content:"";position:absolute;top:1px;left:0;width:10px;height:10px;background:var(--page);border:2px solid var(--line-2)}
.trk .s.on{color:var(--ink-2)}
.trk .s.on::before{background:var(--ink)}
.trk .s.on::after{background:var(--ink);border-color:var(--ink)}
.trk .s.cur{color:var(--ink);font-weight:600}
.trk .s.cur::before{background:linear-gradient(90deg,var(--ink) 0 10px,var(--line) 10px)}
.mini{display:flex;gap:2px;width:100px;margin-top:5px}
.mini i{flex:1;height:4px;background:var(--line)}
.mini i.on{background:var(--ink)}

/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:0;overflow-x:auto;border:1px solid var(--line)}
.col{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px;background:var(--wash)}
.col:last-child{border-right:0}
.col h3{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.col h3 span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.card{background:var(--page);border:1px solid var(--line);padding:11px;display:grid;gap:7px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--ink)}
.card .t{font-weight:600;font-size:13.5px}
.card .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* timeline */
.tl .i{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .i:last-child{border-bottom:0}
.tl .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-ink);padding-top:2px}
.tl .m{font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.quote{border-left:2px solid var(--blue);padding:4px 0 4px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

/* map */
.tm{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;width:100%;max-width:600px;min-width:300px}
.tile{aspect-ratio:1;display:grid;place-items:center;font:500 10.5px var(--mono);color:#fff;border:0;cursor:pointer;padding:0}
.tile.light{color:var(--ink)}
.tile.un{background:var(--page);box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.tile.sel{outline:2px solid var(--blue);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block}

/* bars */
.hb{display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.hb .tr{height:10px;background:var(--fog)}
.hb .tr i{display:block;height:100%}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}

/* banner, notes */
.banner{border:1px solid var(--line);background:var(--blue-soft);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--wash);border:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.mail{border:1px solid var(--line);background:var(--wash);padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.55}
.bigact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;border:1px solid var(--line)}
.bigact button{border:0;border-right:1px solid var(--line);background:var(--page);padding:18px;text-align:left;cursor:pointer;display:grid;gap:4px}
.bigact button:last-child{border-right:0}
.bigact button:hover{background:var(--wash)}
.bigact b{font-size:15px;font-weight:600}
.bigact span{font-size:13px;color:var(--muted)}
@media (max-width:700px){.bigact button{border-right:0;border-bottom:1px solid var(--line)}}

/* modal + toast */
.ov{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md{background:var(--page);max-width:580px;width:100%;max-height:100%;overflow:auto;padding:24px;display:grid;gap:16px;border:1px solid var(--line-2)}
.md h2{font-size:22px;font-weight:300;letter-spacing:-.5px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:11px 14px 11px 16px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{background:transparent;border:1px solid #555;color:#fff;padding:3px 10px;cursor:pointer;font-weight:600;font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head><body>

<aside class="demo" id="demo" aria-label="Prototype controls"></aside>
<div class="frame-lbl">↓ The Acorn platform, as this user sees it ↓</div>
<header class="top">
  <div class="bar1" id="bar1"></div>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $m=n=>'$'+Math.round(n).toLocaleString('en-US');
const $k=n=>Math.abs(n)>=1000?'$'+(n/1000).toFixed(Math.abs(n)>=100000?0:1).replace(/\.0$/,'')+'k':$m(n);
const pd=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const addD=(s,n)=>{const x=pd(s);x.setDate(x.getDate()+n);return iso(x)};
const fd=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const fdy=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const wk=s=>pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const ago=s=>Math.round((pd(TODAY)-pd(s))/864e5);
const rel=s=>{const d=ago(s);return d===0?'today':d===1?'yesterday':d===-1?'tomorrow':d>0?`${d} days ago`:`in ${-d} days`};
const me=()=>USERS.find(u=>u.id===S.role);
const C=id=>db.clinics.find(c=>c.id===id);
const L=id=>db.leads.find(l=>l.id===id);
const O=id=>db.orders.find(o=>o.id===id);
const repOf=st=>db.terr[st]||null;
const repName=r=>r?REPS[r].name:'No RSM';
const repTag=r=>r?`<span class="row" style="gap:7px;flex-wrap:nowrap"><span class="sw" style="background:${REPS[r].c}"></span>${esc(REPS[r].name)}</span>`:`<span class="tag bad">No RSM</span>`;
const tag=(t,k='')=>`<span class="tag ${k}">${esc(t)}</span>`;
const oval=o=>P[o.sku].p*o.qty;
const zipState=z=>{const n=parseInt(String(z).slice(0,3),10);if(isNaN(n)||String(z).length<5)return null;const r=ZIP3.find(([a,b])=>n>=a&&n<=b);return r?r[2]:null};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const lockI='<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 1 0-4 0v2z"/></svg>';
function ptLabel(name){const r=S.role;if(r==='cs'||r==='lab'||r==='clinic')return esc(name);if(r==='admin')return esc(name.split(' ').map(w=>w[0]+'.').join(' '));return `<span class="lock">${lockI}Hidden</span>`}
function ptCan(){return ['cs','lab','clinic'].includes(S.role)}
function stTag(c){return c.status==='Onboarding'?tag('Onboarding','blue'):c.status==='Inactive'?tag('Inactive','bad'):tag('Active','good')}
function oTag(o){const late=orderLate(o);const k=o.stage>=5?'good':late?'bad':o.stage===0?'warn':'';return tag(late?OST[o.stage]+' · late':OST[o.stage],k)}
function paidTag(p){return tag(p==='FOC'?'Free (FOC)':p,p==='Paid'?'good':p==='FOC'?'blue':'warn')}
function mini(i){let s='';for(let k=0;k<7;k++)s+=`<i class="${k<=i?'on':''}"></i>`;return `<div class="mini" aria-hidden="true">${s}</div>`}
function trk(i,plain){const L=plain?OST_PLAIN:OST;return `<div class="trk">${L.map((s,k)=>`<div class="s ${k<=i?'on':''} ${k===i?'cur':''}">${s}</div>`).join('')}</div>`}
function stageAge(o){return ago(o.sd)}
function orderLate(o){return o.stage<6&&stageAge(o)>SLA[o.stage]}
function q4rev(r){return db.q4base[r]+db.orders.filter(o=>o.paid==='Paid'&&o.date>='2026-10-26'&&repOf(C(o.clinic).st)===r).reduce((a,o)=>a+oval(o),0)}
function q4count(r){return Math.round(db.q4base[r]/2150)+db.orders.filter(o=>o.paid==='Paid'&&o.date>='2026-10-26'&&repOf(C(o.clinic).st)===r).length}
function weighted(r){return db.leads.filter(l=>l.stage<5&&(!r||repOf(l.st)===r)).reduce((a,l)=>a+l.value*STAGES[l.stage].p/100,0)}
function overdue(i){return i.status==='Open'&&i.due<TODAY}
function estShip(o){return addD(o.date,21)}
function estLine(o){
  if(o.stage===0)return o.paid==='Unpaid'?'Waiting on payment. Production starts once it\'s paid.':'We review new orders within 1 business day.';
  if(o.stage<4)return `Expected to ship ${wk(estShip(o))}, arriving about ${wk(addD(estShip(o),2))}.`;
  if(o.stage===4)return `On its way with FedEx, tracking ${o.track}.`;
  return 'Delivered.';
}

function badge(v){
  const u=me();let n=0,hot=false;
  if(v==='requests'){n=db.requests.filter(r=>r.owner===u.person&&r.status!=='Done').length}
  else if(v==='home'){const it=salesItems();n=it.length;hot=it.some(i=>i.lv==='bad')}
  else if(v==='queue'){n=csItems().length;hot=true}
  else if(v==='samples'){n=db.samples.filter(s=>!s.dispo).length;hot=n>0}
  else if(v==='production'){n=db.orders.filter(o=>o.stage>=1&&o.stage<=2).length}
  else if(v==='overview'){n=adminItems().length;hot=true}
  else if(v==='cash'){n=db.invoices.filter(overdue).length;hot=n>0}
  else if(v==='billing'){n=db.invoices.filter(i=>i.clinic==='c5'&&i.status==='Open').length;hot=n>0}
  else if(v==='pickups'){n=db.pickups.filter(p=>p.status===0).length}
  return n?`<span class="cnt ${hot?'hot':''}">${n}</span>`:'';
}

function searchResults(q){
  q=q.trim().toLowerCase();if(q.length<2)return '';const out=[];
  const canAcct=['sales','admin','cs','fin'].includes(S.role);
  if(canAcct){const cs=db.clinics.filter(c=>c.name.toLowerCase().includes(q)||c.zip.includes(q)).slice(0,5);if(cs.length)out.push(['Clinics',cs.map(c=>[`openAcct`,c.id,esc(c.name),`${esc(c.city)}, ${c.st}`])])}
  if(S.role!=='mkt'){const os=db.orders.filter(o=>o.id.toLowerCase().includes(q)||(o.track&&o.track.includes(q))||(ptCan()&&o.pt.toLowerCase().includes(q))).slice(0,6);if(os.length)out.push(['Orders',os.map(o=>['orderView',o.id,`${o.id} · ${esc(C(o.clinic).name)}`,OST[o.stage]+(o.track&&o.track.includes(q)?' · '+o.track:'')])])}
  if(['cs','admin'].includes(S.role)){const ps=db.pickups.filter(p=>p.track&&p.track.toLowerCase().includes(q)).slice(0,4);if(ps.length)out.push(['Pickups',ps.map(p=>['pickupGo',p.id,`${esc(C(p.clinic).name)} pickup`,`${p.track} · ${PSTAT[p.status]}`])])}
  if(['sales','admin','mkt'].includes(S.role)){const ls=db.leads.filter(l=>l.name.toLowerCase().includes(q)&&(S.role!=='sales'||repOf(l.st)===me().rep)).slice(0,5);if(ls.length)out.push(['Leads',ls.map(l=>[S.role==='mkt'?'toastOnly':'openLead',l.id,esc(l.name),STAGES[l.stage].n])])}
  if(!out.length)return `<div class="sres"><div class="empty small">No matches for “${esc(q)}”.${!ptCan()?' Patient names are hidden for your role.':''}</div></div>`;
  return `<div class="sres">${out.map(([g,rows])=>`<div class="grp">${g}</div>${rows.map(([a,id,t,s])=>`<button data-a="${a}" data-id="${id}" data-m="Leads open in the rep's view."><span>${t}</span><small>${esc(s)}</small></button>`).join('')}`).join('')}</div>`;
}

A.pkNext=d=>{const p=db.pickups.find(x=>x.id===d.id);p.status++;

  else toast(`Marked ${PSTAT[p.status].toLowerCase()}.`);render()};
A.dispo=d=>{const s=db.samples.find(x=>x.id===d.id);s.dispo=DISPO[+d.i];render();toast(`${s.id} flagged: ${s.dispo}.`,()=>{s.dispo=null})};
A.devDone=d=>{const x=db.devs.find(v=>v.id===d.id);x.status='Resolved';render();toast('Resolved.',()=>{x.status='Investigating'})};
A.rqSt=d=>{const r=db.requests.find(x=>x.id===d.id);const prev=r.status;r.status=d.s;const n=[me().person,d.s==='Done'?'Marked done.':'On it.'];r.notes.push(n);render();toast(`${r.from===me().person?r.owner:r.from} was notified.`,()=>{r.status=prev;r.notes.splice(r.notes.indexOf(n),1)})};
A.answerQ3=()=>{const r=db.requests.find(x=>x.id==='r1');const {out,excl}=q3ByRep();r.notes.push([me().person,`Live numbers: ${Object.entries(out).map(([k,v])=>`${REPS[k].name} ${v.n}`).join(', ')}. Colorado (${excl}) excluded.`]);r.status='Done';render();toast('Sent to Katie and closed.')};
A.onb=d=>{const c=C(d.id);const x=c.onb[+d.i];x[3]=!x[3];if(c.onb.every(y=>y[3])){c.status='Active';toast(`${c.name} is fully onboarded.`)}render()};
A.remind=d=>{const i=db.invoices.find(x=>x.id===d.id);if(i)i.reminded=true;render();toast(`Stripe pay link sent for ${d.id}.`)};
A.askRep=d=>{const i=db.invoices.find(x=>x.id===d.id);const c=C(i.clinic);const r=repName(repOf(c.st));db.requests.push({id:'r'+db.seq.req++,title:`Help collect ${$m(i.amt)} from ${c.name} (${i.id}, ${ago(i.due)} days late)`,from:me().person,owner:r==='No RSM'?'Mike Romo':r,due:addD(TODAY,3),status:'Open',src:'request',urgent:false,notes:[]});render();toast(`Request sent to ${r==='No RSM'?'Mike Romo':r}.`)};
A.payOk=d=>{const p=db.pays.find(x=>x.id===d.id);p.ok=true;const inv=db.invoices.find(i=>i.id==='INV-1038');render();toast('Refund confirmed. Tay and the clinic were notified.',()=>{p.ok=false})};
A.payMatch=d=>{const p=db.pays.find(x=>x.id===d.id);p.ref='SEC-2615';render();toast('Matched to SEC-2615.',()=>{p.ref=''})};
A.refOk=d=>{db.refs[+d.i].status='Approved';render()};
A.nano=()=>{toast('6 Nanocools are on the way. Arriving Monday.')};
A.paySim=d=>{const i=db.invoices.find(x=>x.id===d.id);i.status='Paid';db.pays.push({id:'pi_3Q'+Math.random().toString(36).slice(2,8),clinic:i.clinic,amt:i.amt,status:'Succeeded',date:TODAY,ref:i.id});
  const o=i.order&&O(i.order);if(o&&o.paid==='Unpaid')o.paid='Paid';closeModal();render();toast(`Paid ${$m(i.amt)}. Your receipt is on its way.`)};

/* ---------- forms ---------- */
const F={};
F.logLead=(v,f)=>{const l=L(f.dataset.id);(l.acts=l.acts||[]).push([TODAY,v.get('type'),me().person,v.get('text')]);l.last=TODAY;render();toast('Logged.')};
F.act=(v,f)=>{const id=f.dataset.id;const rec=[TODAY,v.get('t')||'Call',me().person,v.get('n')];if(id[0]==='l'){const l=L(id);(l.acts=l.acts||[]).push(rec);l.last=TODAY}else C(id).act.push(rec);
  if(v.get('d'))db.tasks.push({id:'t'+db.seq.task++,rep:me().rep||'jill',text:'Follow up: '+v.get('n').slice(0,60),due:v.get('d'),ref:id,done:false});
  db.tasks.filter(t=>t.ref===id&&!t.done&&t.due<=TODAY).forEach(t=>t.done=true);closeModal();render();toast(v.get('d')?'Logged, follow-up scheduled.':'Logged.')};
F.task=v=>{db.tasks.push({id:'t'+db.seq.task++,rep:me().rep||'jill',text:v.get('t'),due:v.get('d'),ref:v.get('r')||null,done:false});closeModal();render();toast('Follow-up added.')};
F.lead=v=>{const z=String(v.get('z')).trim();const st=zipState(z);if(!st){toast('Enter a valid 5-digit US ZIP so the lead reaches the right rep.');return}
  db.leads.push({id:'l'+db.seq.lead++,name:v.get('n'),st,zip:z,src:v.get('s'),ref:v.get('r'),stage:0,value:+v.get('v')||0,created:TODAY,last:TODAY,contact:v.get('c')||'Not added',bg:'New lead.',open:['Openers appear once the practice has been researched.']});
  closeModal();const r=repOf(st);render();toast(S.role==='sales'&&r!==me().rep?`${st} belongs to ${repName(r)}. Handed off.`:`Added and assigned to ${repName(r)}.`)};
F.req=v=>{db.requests.push({id:'r'+db.seq.req++,title:v.get('t'),from:me().person,owner:v.get('o'),due:v.get('d')||addD(TODAY,2),status:'Open',src:'request',urgent:!!v.get('u'),notes:[]});closeModal();render();toast(`Sent to ${v.get('o')}. You'll see it under Requests → I asked.`)};
F.rqNote=(v,f)=>{const t=String(v.get('t')).trim();if(!t)return;db.requests.find(x=>x.id===f.dataset.id).notes.push([me().person,t]);render()};
F.fedex=(v,f)=>{const p=db.pickups.find(x=>x.id===f.dataset.id);p.track=v.get('tn');p.status=1;if(v.get('nano'))p.note='6 Nanocools sent with driver';
  if(v.get('mail'))C(p.clinic).act.push([TODAY,'Email','Katie Anderson',`FedEx pickup confirmed for ${fd(p.date)}, tracking ${p.track}.`]);closeModal();render();toast('FedEx booked. Clinic emailed.')};
F.ship=(v,f)=>{const o=O(f.dataset.id);o.track=v.get('tn');o.stage=4;o.sd=TODAY;C(o.clinic).act.push([TODAY,'Email','Katie Anderson',`${o.id} shipped, tracking ${o.track}.`]);closeModal();render();toast(`${o.id} shipped. Clinic and rep notified.`)};
F.dev=v=>{db.devs.push({id:'DV-0'+db.seq.dev++,order:v.get('order'),kind:v.get('kind'),text:v.get('text'),owner:v.get('owner'),action:v.get('action')||'Under investigation.',status:'Investigating',date:TODAY});closeModal();go('deviations');toast(`Logged. ${v.get('owner')} was notified.`)};
F.repl=(v,f)=>{const o=O(f.dataset.id);const id='SEC-'+db.seq.order++;db.orders.push({id,clinic:o.clinic,pt:o.pt,sku:o.sku,qty:o.qty,paid:'FOC',stage:1,date:TODAY,sd:TODAY,track:'',foc:'Replacement: '+v.get('r'),orig:o.id});closeModal();render();toast(`${id} created and sent to the lab.`)};
F.foc=(v,f)=>{const m=db.inbox.find(x=>x.id===f.dataset.id);const id='SEC-'+db.seq.order++;db.orders.push({id,clinic:m.clinic,pt:v.get('pt'),sku:v.get('sku'),qty:1,paid:'FOC',stage:1,date:TODAY,sd:TODAY,track:'',foc:v.get('r'),orig:''});m.open=false;closeModal();render();toast(`${id} created. ${m.from} was notified.`)};
F.order=v=>{const id='SEC-'+db.seq.order++;const sku=v.get('sku')||'twelve';db.orders.push({id,clinic:CL,pt:v.get('pt'),sku,qty:1,paid:'Unpaid',stage:0,date:TODAY,sd:TODAY,track:'',foc:'',orig:''});
  db.invoices.push({id:'INV-'+db.seq.inv++,clinic:CL,amt:P[sku].p,issued:TODAY,due:addD(TODAY,30),status:'Open',order:id});closeModal();go('porders');toast(`Order placed. Pay ${$m(P[sku].p)} to start production.`)};
F.pickup=v=>{db.pickups.push({id:'p'+db.seq.pickup++,clinic:CL,appt:`${fd(v.get('cd'))}, ${v.get('ct')}`,date:v.get('cd'),win:v.get('w'),n:+v.get('n'),nano:+v.get('nano'),status:0,track:'',note:v.get('c'),created:`${TODAY} 12:44`});render();toast('Pickup requested. FedEx details will arrive by email.')};
F.campaign=v=>{db.campaigns.push({id:'cp'+db.seq.camp++,name:v.get('subj'),ch:v.get('ch'),aud:v.get('aud'),status:'Scheduled',date:v.get('date'),sent:AUD[v.get('aud')]||0,open:0,click:0,mql:0});S.f.draft=null;go('campaigns');toast('Scheduled.')};
F.reassign=(v,f)=>{const st=f.dataset.st,r=v.get('rep');const prev=db.terr[st];if(r)db.terr[st]=r;else delete db.terr[st];
  const cl=db.clinics.filter(c=>c.st===st).length,ls=db.leads.filter(l=>l.st===st&&l.stage<5).length;render();
  toast(`${st} moved to ${repName(r||null)} with ${plural(cl,'clinic')} and ${plural(ls,'lead')}.`,()=>{if(prev)db.terr[st]=prev;else delete db.terr[st]})};
F.zipcheck=v=>{S.f.zip=String(v.get('zip')).trim();render()};

/* ---------- wiring ---------- */
function showRes(){const box=document.getElementById('sres');if(box)box.innerHTML=searchResults(S.q)}
document.addEventListener('click',e=>{
  if(!e.target.closest('.search')){const b=document.getElementById('sres');if(b&&b.innerHTML){b.innerHTML=''}}
  const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.a==='ovClose'){fn(el.dataset,el,e);return}
  if(el.tagName!=='INPUT')e.preventDefault();e.stopPropagation();fn(el.dataset,el,e)});
document.addEventListener('input',e=>{
  if(e.target.id==='gsearch'){S.q=e.target.value;showRes()}
  if(e.target.dataset.in==='draft'||e.target.dataset.ch==='draft'){const f=document.getElementById('cform');const fdt=new FormData(f);S.f.draft={ch:fdt.get('ch'),aud:fdt.get('aud'),subj:fdt.get('subj'),body:fdt.get('body'),date:fdt.get('date')};const p=document.getElementById('cprev');if(p)p.innerHTML=prevMail(S.f.draft);
    const b=f.querySelector('.btn.pri');if(b)b.textContent=`Schedule for ${AUD[S.f.draft.aud]} people`}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal)closeModal();else if(S.q){S.q='';renderTop()}}
  if(e.key==='/'&&!e.target.closest('input,textarea,select')){const i=document.getElementById('gsearch');if(i){e.preventDefault();i.focus()}}
  if(e.key==='Enter'&&e.target.id==='gsearch'){const b=document.querySelector('.sres button');if(b){e.preventDefault();b.click()}}});
document.addEventListener('focusin',e=>{if(e.target.id==='gsearch'&&S.q)showRes()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();F[f.dataset.f](new FormData(f),f)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.ch==='leadStage'){const l=L(el.dataset.id);const v=+el.value;if(v===5){A.leadWon({id:l.id});return}const prev=l.stage;l.stage=v;l.last=TODAY;render();toast(`Moved to ${STAGES[v].n}.`,()=>{l.stage=prev})}
  if(el.dataset.ch==='draft'){el.dispatchEvent(new Event('input',{bubbles:true}))}});
render();
</script>
